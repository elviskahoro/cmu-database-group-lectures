# Reflex architecture: web.web -> web.pages.index -> web.components.* (public exports only).
# rxconfig is an isolated framework entrypoint. New module imports require review.
# https://docs.gauge.sh/usage/configuration
source_roots = ["."]
root_module = "forbid"
exact = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
include_string_imports = true
# Three layers with strict ordering: production entrypoints -> pages ->
# components. Layers are NOT closed (the closed-layer flag does not
# allow per-module exemptions, and the smoke net in `tests/` needs to
# construct status_card directly with literal inputs to keep regression
# coverage honest). The intended `web.web -> web.pages.* ->
# web.components.*` flow is still enforced at the visible-edges:
# - `web.web.depends_on = ["web.pages.index"]` (entrypoint -> pages only)
# - `web.components.status_card.visibility = ["web.pages.index", "tests"]`
#   (the component is reachable from the page module and from the
#   test module, but NOT from `web.web` itself)
# - tests' visibility is `[]`, so production code cannot accidentally
#   import it.
# This is the same shape buridan-ui uses for its in-repo `tests/`
# (see .tach/trunk.yaml in that repo, which does not use `closed`).
layers = ["entrypoints", "pages", "components"]
layers_explicit_depends_on = true

# Do not let .gitignore silently remove application code from architecture checks.
respect_gitignore = false
exclude = [
  ".agents/**",
  ".claude/**",
  ".context/**",
  ".git/**",
  ".trunk/**",
  ".venv/**",
  ".web/**",
  "**/__pycache__/**",
  "symlink/**",
]

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"
unused_external_dependencies = "error"
local_imports = "error"

[cache]
file_dependencies = [
  "tests/**",
  "pyproject.toml",
  "uv.lock",
  "tach.toml",
  "rxconfig.py",
  "reflex.lock/**",
]

# Smoke tests run pytest (and hypothesis for property tests), which are
# dev-only deps. Telling tach to skip external checking for them keeps `uv run tach check-external`
# aligned with what pyproject.toml actually declares (production deps
# only) rather than forcing pytest into `[project].dependencies`.
# lancedb, nomic, and sentence-transformers are likewise dev-group-only
# (probe / embed / load scripts), so they are excluded here for the same
# reason rather than promoted to production dependencies.
[external]
# Exclusions match import names literally: sentence-transformers is imported
# as sentence_transformers, so both spellings are listed.
# modal, fastapi and huggingface_hub are deploy-only: baked into the Modal
# image built in lecture_search.search_api, deliberately absent from the dev
# venv (guarded import), so they are excluded here rather than added to
# pyproject.
exclude = [
  "pytest",
  "hypothesis",
  "httpx",
  "lancedb",
  "marimo",
  "nomic",
  "numpy",
  "sentence-transformers",
  "sentence_transformers",
  # torch is imported only by the marimo notebook (device detection), whose
  # deps come from its PEP 723 header, not pyproject.
  "torch",
  "modal",
  "fastapi",
  "huggingface_hub",
]

# Default-deny new packages instead of folding their imports into a parent module.
# Single-level globs keep each page's implementation inside its package boundary.
# Concrete module declarations below override these defaults.
[[modules]]
path = "web.*"
layer = "entrypoints"
depends_on = []
depends_on_external = []
visibility = []

[[modules]]
path = "web.pages.*"
layer = "pages"
depends_on = []
depends_on_external = []
visibility = []

[[modules]]
path = "web.components.*"
layer = "components"
depends_on = []
depends_on_external = []
visibility = []

# Reflex loads these entrypoints directly; other modules cannot import them.
[[modules]]
path = "rxconfig"
layer = "entrypoints"
depends_on = []
depends_on_external = ["reflex"]
visibility = []

[[modules]]
path = "web"
layer = "entrypoints"
depends_on = []
depends_on_external = []
visibility = []

[[modules]]
path = "web.web"
layer = "entrypoints"
depends_on = ["web.pages.index"]
depends_on_external = ["reflex"]
# `tests` imports the app to enumerate compiled page imports.
visibility = ["tests"]

[[modules]]
path = "web.pages"
layer = "pages"
depends_on = []
depends_on_external = []
visibility = []

# Registration uses only the package's public page function.
[[modules]]
path = "web.pages.index"
layer = "pages"
depends_on = ["web.components.status_card"]
depends_on_external = ["reflex"]
# `tests` reaches this page module directly because layers are open
# (see `layers` above for why). `web.web` drives the same `page`
# symbol at runtime; the smoke net drives it at import time.
visibility = ["web.web", "tests"]

[[modules]]
path = "web.components"
layer = "components"
depends_on = []
depends_on_external = []
visibility = []

# Reusable component: takes state and handlers as arguments, imports no page.
[[modules]]
path = "web.components.status_card"
layer = "components"
depends_on = []
depends_on_external = ["reflex"]
# `tests` joins this visibility so the smoke net can call status_card
# directly with literal inputs (verifying `EventType`, `rx.Component`
# return, etc.). Production modules (`web.pages.index`) reach the
# component via the `depends_on = [...]` declaration on the page
# itself; nothing in `web.web` is allowed here because visibility
# does not list it.
visibility = ["web.pages.index", "tests"]

[[interfaces]]
# Modules have no public members unless an explicit interface below exposes them.
expose = []

[[interfaces]]
# Interface selectors are regexes, unlike module paths: escape literal dots.
from = ['web\.pages\.index']
# Both `page` (the runtime factory) and `IndexState` (the state class
# the smoke net instantiates by reference) are exposed. `page` is the
# only symbol the reflex app calls at runtime; `IndexState` is a class
# the app references by name, not by construction.
expose = ["page", "IndexState"]
# `tests` joins web.web as a permitted consumer so the smoke net can
# call the page factory and read the IndexState class at import time.
visibility = ["web.web", "tests"]
exclusive = true

[[interfaces]]
from = ['web\.web']
expose = ["app"]
visibility = ["tests"]
exclusive = true

[[interfaces]]
from = ['web\.components\.status_card']
expose = ["status_card"]
visibility = ["web.pages.index", "tests"]
exclusive = true

[[interfaces]]
from = ['lecture_search']
expose = [
  "ChunkRecord",
  "Segment",
  "chunk_transcript",
  "load_titles_all",
  "process_corpus_transcripts",
  "process_sample_transcripts",
]
visibility = [
  "scripts.load_sample",
  "scripts.load_corpus",
  "scripts.parity_gate",
  "tests",
]
exclusive = true

[[interfaces]]
# DOCUMENT_PREFIX / EMBEDDING_DIMS / QUERY_PREFIX are imported by the prefix
# guards in tests/ and by scripts.load_corpus (dimension assertion).
from = ['lecture_search\.embed']
expose = [
  "DOCUMENT_PREFIX",
  "EMBEDDING_DIMS",
  "LectureChunk",
  "QUERY_PREFIX",
  "create_lectures_table",
  "embed_documents",
  "embed_query",
]
visibility = [
  "scripts.load_sample",
  "scripts.verify_hybrid",
  "scripts.retrieval_check",
  "scripts.load_corpus",
  "lecture_search.search_api",
  "tests",
]
exclusive = true

# Smoke tests are layer-peer entrypoints. They can reach
# web.pages.index and web.components.status_card directly because
# layers are open (see `layers` above). Production modules cannot
# accidentally import `tests/` because its `visibility = []` excludes
# everything from the production module graph. pytest is not in
# `depends_on_external` because [external].exclude above covers it
# (likewise hypothesis);
# reflex is listed because every reflex page factory invocation
# imports it transitively.
[[modules]]
path = "tests"
layer = "entrypoints"
depends_on = [
  "web.pages.index",
  "web.components.status_card",
  "web.web",
  "lecture_search",
  "lecture_search.embed",
  "lecture_search.fireworks",
  "lecture_search.quality",
  "lecture_search.search_api",
  "scripts.retrieval_check",
]
depends_on_external = ["reflex", "httpx"]
visibility = []

# Typed wrappers over LanceDB's partially-Unknown client API, shared by the
# lancedb-touching scripts so the narrow per-line pyright ignores for those
# third-party stubs live in exactly one module.
[[modules]]
path = "scripts.lancedb_typed"
layer = "entrypoints"
depends_on = []
depends_on_external = ["lancedb"]
visibility = [
  "scripts.lancedb_probe",
  "scripts.load_corpus",
  "scripts.load_sample",
  "scripts.verify_hybrid",
  "scripts.retrieval_check",
]

[[interfaces]]
from = ['scripts\.lancedb_typed']
expose = [
  "InsertRow",
  "SearchRow",
  "ScoredSearchRow",
  "add_rows",
  "create_table_from_rows",
  "filtered_vector_search_rows",
  "fts_search_rows",
  "hybrid_search_rows",
  "merge_insert_rows",
  "vector_search_rows",
]
visibility = [
  "scripts.lancedb_probe",
  "scripts.load_corpus",
  "scripts.load_sample",
  "scripts.verify_hybrid",
  "scripts.retrieval_check",
]
exclusive = true

# Standalone probe scripts are independent from the web application.
[[modules]]
path = "scripts.lancedb_probe"
layer = "entrypoints"
depends_on = ["scripts.lancedb_typed"]
depends_on_external = ["lancedb", "nomic"]
visibility = []

[[modules]]
path = "lecture_search"
layer = "entrypoints"
depends_on = []
depends_on_external = []
visibility = [
  "scripts.load_sample",
  "scripts.load_corpus",
  "scripts.parity_gate",
  "tests",
]

# Nomic v1.5 embedder: registry function held at module top, prefixes
# prepended manually, heavy deps kept out of lecture_search/__init__.py.
[[modules]]
path = "lecture_search.embed"
layer = "entrypoints"
depends_on = []
depends_on_external = ["lancedb"]
visibility = [
  "scripts.load_sample",
  "scripts.verify_hybrid",
  "scripts.retrieval_check",
  "scripts.load_corpus",
  "lecture_search.search_api",
  "tests",
]

# Fireworks hosted embeddings: batched, retried, disk-cached. Prefixes stay
# in lecture_search.embed; this module only talks to the API verbatim.
[[modules]]
path = "lecture_search.fireworks"
layer = "entrypoints"
depends_on = []
depends_on_external = ["httpx"]
visibility = ["scripts.load_corpus", "tests"]

# Chunk-quality filter (cdgl-819): drops degenerate Whisper chunks before
# embedding. Pure stdlib text stats; structural ChunkLike protocol keeps it
# independent of lecture_search.chunking.
[[modules]]
path = "lecture_search.quality"
layer = "entrypoints"
depends_on = []
depends_on_external = []
visibility = ["scripts.load_corpus", "tests"]

[[interfaces]]
from = ['lecture_search\.quality']
expose = [
  "MAX_DOMINANT_BIGRAM_SHARE",
  "MAX_DOMINANT_WORD_SHARE",
  "MAX_DUPLICATE_SENTENCE_SHARE",
  "MAX_REPEATED_TRIGRAM_COVERAGE",
  "MIN_UNIQUE_RATIO",
  "MIN_WORDS",
  "chunk_drop_reasons",
  "drop_report_lines",
  "partition_chunks",
]
visibility = ["scripts.load_corpus", "tests"]
exclusive = true

# Modal search API (cdgl-bcy, reworked cdgl-99e): holds the LanceDB key
# server-side, serves read-only hybrid search. Embedding is client-side —
# the request carries the query vector — so the module intentionally does
# NOT depend on lecture_search.embed (would pull sentence-transformers into
# the slim lancedb+fastapi image). modal/fastapi are image-only deps (see
# [external]).
[[modules]]
path = "lecture_search.search_api"
layer = "entrypoints"
depends_on = []
depends_on_external = ["lancedb", "modal", "fastapi"]
visibility = ["tests"]

[[interfaces]]
from = ['lecture_search\.search_api']
expose = [
  "MAX_BODY_BYTES",
  "MAX_QUERY_CHARS",
  "MAX_TOP_K",
  "MAX_VIDEO_IDS",
  "VECTOR_DIMS",
  "RequestValidationError",
  "SearchParams",
  "build_where",
  "check_body_size",
  "parse_search_request",
  "run_hybrid_search",
  "scan_lecture_rows",
  "serialize_row",
  "summarize_lectures",
]
visibility = ["tests"]
exclusive = true

[[interfaces]]
from = ['lecture_search\.fireworks']
expose = [
  "COST_PER_MILLION_TOKENS_USD",
  "EmbeddingCache",
  "FireworksEmbedder",
  "cache_key",
  "load_fireworks_api_key",
]
visibility = ["scripts.load_corpus", "tests"]
exclusive = true

# Full-corpus loader: Fireworks embeddings -> LanceDB table (default
# 'lectures'), resumable via the on-disk embedding cache.
[[modules]]
path = "scripts.load_corpus"
layer = "entrypoints"
depends_on = [
  "lecture_search",
  "lecture_search.embed",
  "lecture_search.fireworks",
  "lecture_search.quality",
  "scripts.lancedb_typed",
]
depends_on_external = ["lancedb"]
visibility = []

# Loads chunked sample transcripts into LanceDB Cloud lectures_sample.
[[modules]]
path = "scripts.load_sample"
layer = "entrypoints"
depends_on = ["lecture_search", "lecture_search.embed", "scripts.lancedb_typed"]
depends_on_external = ["lancedb"]
visibility = []

# Read-only FTS/hybrid verification against the real lectures_sample table.
[[modules]]
path = "scripts.verify_hybrid"
layer = "entrypoints"
depends_on = ["lecture_search.embed", "scripts.lancedb_typed"]
depends_on_external = ["lancedb"]
visibility = []

# Fireworks-vs-local embedding parity gate (docs/parity-gate.md). numpy and
# sentence-transformers are dev-group-only, covered by [external].exclude.
[[modules]]
path = "scripts.parity_gate"
layer = "entrypoints"
depends_on = ["lecture_search"]
depends_on_external = ["httpx", "numpy", "sentence-transformers"]
visibility = []

# Read-only retrieval smoke check (vector-only vs hybrid top-10) against
# the real lectures_sample table; writes data/retrieval_check.json.
[[modules]]
path = "scripts.retrieval_check"
layer = "entrypoints"
depends_on = ["lecture_search.embed", "scripts.lancedb_typed"]
depends_on_external = ["lancedb"]
# tests/ imports its pure helpers (expected_rank, QUERIES).
visibility = ["tests"]

[[interfaces]]
from = ['scripts\.retrieval_check']
expose = ["QUERIES", "expected_rank"]
visibility = ["tests"]
exclusive = true
