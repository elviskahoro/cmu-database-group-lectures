# Vale runs on docs/** via the docs-markdown file type in .trunk/trunk.yaml.
# Trunk's vale integration copies only this file into its run sandbox
# (direct_configs: [.vale.ini]), so a StylesPath pointing at a repo directory
# would not resolve there. Until real styles are adopted (which also needs the
# trunk vale definition to copy the styles tree), this config enables no rules
# and simply keeps vale green.
[*]
