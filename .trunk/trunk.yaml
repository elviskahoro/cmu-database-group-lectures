# This file controls the behavior of Trunk: https://docs.trunk.io/cli # To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0

# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

    - id: oss-linter-trunk
      ref: v0.2026.04.14.00.00
      uri: https://github.com/elviskahoro/oss-linter-trunk-config

    - id: add-trailing-comma-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-add-trailing-comma

    - id: pyrefly-plugin
      ref: v0.2.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-pyrefly

    - id: tach-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-tach

# actionlint switched from upstream rhysd/actionlint to the actively maintained
# fork kjanat/actionlint (forked from upstream v1.7.12, independent releases from
# v1.8.0, CLI-compatible). Trunk's plugin catalog still pins the rhysd download
# URL, so override it here until the catalog carries the fork. Asset naming and
# the -format JSON output the plugin's `lint` command relies on are unchanged.
downloads:
  - name: actionlint
    downloads:
      - os:
          linux: linux
          macos: darwin
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${cpu}.tar.gz
      - os: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_windows_${cpu}.zip

# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
        - name: lint
          enabled: true
    # The plugin's default command checks module boundaries. Tach's external
    # dependency audit is separate, so include it in the same Trunk gate.
    #
    # No `external` command here on purpose. Trunk executes batch lint
    # commands from a sandboxed tmp dir that contains only the diff's files
    # plus direct configs, and `tach check-external` decides "used" by
    # scanning the imports visible from its cwd -- the diff, not the tree.
    # Every runtime dependency whose import sites sit outside the diff was
    # reported "not used": #108's own PR run flagged all four (httpx, pydantic,
    # pydantic_settings, typer), and any single-file Python PR trips it the
    # same way, which would reject every queue entry once the merge queue
    # gates on this pipeline. There is no way to point it at the real
    # workspace from a lint command (Trunk does binary lookup, not a shell,
    # so `cd ${workspace} && ...` dies with "Unable to find binary in PATH:
    # cd"; tach has no --root flag), so the audit lives in .rwx/lint.yml's
    # tach-external task, which runs against the full checkout and is
    # required by the same queue.
    - name: tach
      commands:
        - name: lint
          run: tach check --dependencies --interfaces --exact
    # Trunk runs linters from a sandboxed tmp dir with `env -i`, so pyright's
    # usual environment discovery (PATH lookup) lands on Trunk's own node
    # runtime, which has none of the project's dependencies. That made pyright
    # silently check the whole SDK against Unknown types (reportMissingImports
    # is "none" in the config, so nothing flagged). Point it at the project
    # venv, the same way the pyrefly plugin does for pyrefly.
    #
    # This overrides the plugin's whole pyright invocation, so re-check this
    # command against the plugin definition whenever trunk.yaml bumps plugin
    # versions. If `.venv` is missing the check fails red with confusing
    # Unknown-type findings (pyright warns about the bad --pythonpath but
    # still runs), so `uv sync` before the first check — see AGENTS.md.
    - name: pyright
      commands:
        - name: lint
          run: pyright --pythonpath ${workspace}/.venv/bin/python --outputjson ${target}

    # Trunk runs linters from a sandboxed tmp dir, so pyrefly's usual environment
    # discovery (interpreter resolution via PATH lookup) lands in Trunk's sandbox,
    # not the project workspace. The pyrefly plugin (oss-linter-trunk-pyrefly v0.2.0)
    # claims to pass --python-interpreter-path ${workspace}/.venv/bin/python and
    # --search-path ${workspace} automatically, but this fails in environments where
    # .venv/bin/python is a symlink to /usr/local/bin/python3 (typical in cloud
    # sandboxes), because pyrefly's interpreter-resolver follows the symlink target,
    # landing outside the venv's site-packages. See #120.
    #
    # This overrides the plugin's whole pyrefly invocation to explicitly pass
    # the workspace venv paths, matching the pattern used for pyright above.
    # Re-check this command against the plugin definition whenever trunk.yaml
    # bumps plugin versions.
    #
    # The extra `--search-path ${workspace}/typings` (flags append) makes the
    # repo-local stubs for deploy-only deps (modal, fastapi) resolvable: Trunk
    # symlinks targets into its sandbox and passes them relative to it, so
    # pyrefly's project root becomes the sandbox and its default typings/
    # discovery never sees the workspace's typings/ directory.
    - name: pyrefly
      commands:
        - name: lint
          run: pyrefly check --python-interpreter-path ${workspace}/.venv/bin/python --search-path ${workspace} --search-path ${workspace}/typings --output-format=min-text --summary=none ${target}

    # Vale is scoped exclusively to docs/** via a custom file type -- there is
    # no first-class "restrict this linter to a directory" field on `enabled`
    # entries, and `regexes` (unlike `extensions`) match the full path from
    # the repo root, so markdown outside docs/ (README.md, CHANGELOG.md) is
    # never picked up. Dormant until a docs/ tree and .vale.ini exist here;
    # gtm-sdk scopes its vale the same way.
    - name: vale
      files: [docs-markdown]

  files:
    - name: docs-markdown
      regexes:
        - ^docs/.+\.(md|mdx)$

  # Mirrors gtm-sdk's enabled list (shared lint stack; renovate bumps versions
  # independently per repo). Vale is dormant until a docs/ tree and .vale.ini
  # exist; it currently has no matching files.
  enabled:
    # Pinned to the latest release before 1.17.0 added the cache-write-untrusted,
    # cache-call-unrestricted, and cache-operation policies (default-on in 1.17.0;
    # explicit `policy:` config is supported but the upgrade note warns the new
    # policies can turn previously clean workflows into exits with status 1, even
    # on repositories without a configuration file). Bump to 1.17.x once the
    # surviving workflows (.github/workflows/{pullfrog,pypi}.yml) are revised and
    # the policies pass on them.
    - actionlint@1.16.1
    - add-trailing-comma@4.0.0
    - bandit@1.9.4
    - buildifier@8.2.1
    - checkov@3.3.19
    - markdown-link-check@3.15.0
    - markdownlint-cli2@0.23.3
    - osv-scanner@2.6.0
    - oxipng@10.1.1
    - pinact@4.0.0
    - pyrefly@1.3.1
    - pyright@1.1.414
    - ruff@0.16.8
    - semgrep@1.177.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - squawk@2.65.0
    - svgo@4.1.0
    - tach@0.35.1
    - taplo@0.10.0
    - trivy@0.70.0
    - trufflehog@3.95.3
    - ty@0.0.35
    - vale@3.14.1
    - yamlfmt@0.21.0
    - yamllint@1.38.0

  disabled:
    - ansible-lint
    - autopep8
    - biome
    - black
    - brakeman
    - buf-breaking
    - buf-format
    - buf-lint
    - cfnlint
    - circleci
    - clang-format
    - clang-tidy
    - clippy
    - cmake-format
    - codespell
    - cspell
    - cue-fmt
    - dart
    - deno
    - detekt
    - detekt-explicit
    - detekt-gradle
    - djlint
    - dotenv-linter
    - dotnet-format
    - dustilock
    - eslint
    - flake8
    - git-diff-check
    - gitleaks
    - gofmt
    - gofumpt
    - goimports
    - gokart
    - golangci-lint
    - golangci-lint2
    - golines
    - google-java-format
    - graphql-schema-linter
    - hadolint
    - haml-lint
    - include-what-you-use
    - isort
    - ktlint
    - kube-linter
    - ls-lint
    - markdown-table-prettify
    - markdownlint
    - mypy
    - nancy
    - nbstripout
    - nixpkgs-fmt
    - opa
    - perlcritic
    - perltidy
    - php-cs-fixer
    - phpstan
    - pmd
    - pragma-once
    - pre-commit-hooks
    - prettier
    - prisma
    - psscriptanalyzer
    - pylint
    - regal
    - remark-lint
    - renovate
    - rome
    - rubocop
    - ruff-nbqa
    - rufo
    - rumdl
    - rustfmt
    - scalafmt
    - snyk
    - sort-package-json
    - sourcery
    - sql-formatter
    - sqlfluff
    - sqlfmt
    - standardrb
    - stringslint
    - stylelint
    - stylua
    - swiftformat
    - swiftlint
    - terraform
    - terragrunt
    - terrascan
    - tflint
    - tfsec
    - tofu
    - trufflehog-git
    - trunk-toolbox
    - txtpbfmt
    - yapf

  ignore:
    - linters: [ALL]
      paths:
        - .beads/**
        # marimo notebooks are intentionally excluded from every linter
        - notebooks/**
        - molab-example.py
        - .agents/skills/**
        - data/**
        - tmp/**
        - worktrees/**
        - "**/*.openapi.json"
        - "**/*.openapi.yaml"
        - "**/*.openapi.yml"

    # bd-managed files: `bd setup` generates and overwrites these wholesale
    # (ordered list numbering in SKILL.md, quoted strings in agent manifests).
    # Fixing them by hand would be reverted on the next `bd setup`, so they are
    # waived here rather than churned.
    - linters: [markdownlint-cli2]
      paths:
        - .agents/skills/beads/**
    - linters: [yamllint]
      paths:
        - .agents/skills/beads/**

    # Vendor-managed Pullfrog workflow ("DO NOT EDIT EXCEPT WHERE INDICATED").
    # Mirrors gtm-sdk's pinned copy; its inline trunk-ignores cover the
    # workflow_dispatch prompt finding. Kept waived because a future Pullfrog
    # re-install may still overwrite the file back to stock (unpinned) form,
    # and semgrep/yamlfmt fixes would diverge it further from the vendor form.
    - linters: [checkov, semgrep, yamlfmt]
      paths:
        - .github/workflows/pullfrog.yml

    - linters: [ruff]
      paths:
        - "*.ipynb"

    # Tests intentionally use pytest assertions, private test seams, fixture
    # doubles, and test-only dependencies. Keep production lint/type rules
    # from rejecting those patterns while continuing to check the application
    # package itself.
    - linters: [ruff, pyright, pyrefly, bandit]
      paths:
        - tests/**

    - linters: [checkov, semgrep]
      paths:
        - "**/*.py"
        - "**/*.sh"
        - "**/*.md"
        - "**/*.parquet"
        - "**/*.png"
        - "**/*.jpg"
        - "**/*.jpeg"
        - "**/*.gif"
        - "**/*.ico"
        - "**/*.svg"
        - "**/*.webp"
        - "**/*.zip"
        - "**/*.tar"
        - "**/*.gz"
        - "**/*.bz2"
        - "**/*.7z"
        - "**/*.csv"
        - "**/*.xml"
        - "**/*.proto"

    - linters: [trivy]
      paths:
        - .trunk/**

    - linters: [trufflehog]
      paths:
        - "**/*.parquet"

  exported_configs:
    - plugin_id: oss-linter-trunk
      configs:
        - configs/.bandit
        - configs/.clang-format
        - configs/.clang-tidy
        - configs/.clangd
        - configs/.editorconfig
        - configs/.flake8
        - configs/.gitattributes
        - configs/.gitignore
        - configs/.hadolint.yaml
        - configs/.isort.cfg
        - configs/.markdownlint.yaml
        - configs/.mypy.ini
        - configs/.pr-labels.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/.stylelintrc.yaml
        - configs/.yamlfmt
        - configs/.yamllint.yaml
        - configs/pyrightconfig.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.js

actions:
  enabled:
    - trunk-cache-prune
    - trunk-upgrade-available

  disabled:
    # git-hook-triggered actions disabled so trunk releases core.hooksPath to
    # the shared ~/.config/git/hooks dispatcher (Entire checkpoints, AI
    # co-author stripping, branch policy), matching gtm-sdk. With them enabled,
    # any `trunk check` run re-points core.hooksPath at Trunk's own cache.
    # trunk-check-pre-push is also redundant with roborev review and the merge
    # queue's required lint check (.rwx/lint.yml); git-lfs is unused
    # in this repo.
    - trunk-fmt-pre-commit
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push

merge:
  # Required statuses must be live GitHub status names posted on every PR.
  # Re-verify with: gh pr checks <pr-number> --json name --jq '.[].name'
  required_statuses:
    - "RWX: trunk-check"
    - "RWX: tach-external"
    - "RWX: pytest"
    - "RWX: reflex-export"
    - "RWX: frontend-deps"
